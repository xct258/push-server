#!/bin/bash
# ============================================================
# 配置文件：镜像构建与应用配置
#   构建配置（CI 读取）   ：镜像名 / 标签 / 架构
#   应用配置（模板读取） ：依赖安装
#   启动流程（不在本文件）：startup/prepare.sh 每次启动
#                          startup/once.sh    只执行一次
#                          startup/main.sh    容器主进程
# ============================================================

# ------------------------------------------------------------
# 1. 构建配置：镜像仓库与标签（推送到 Docker Hub）
# ------------------------------------------------------------
IMAGE_REPO=xct258/push-server
IMAGE_TAG=latest

# 构建架构
PLATFORMS=linux/amd64,linux/arm64

# ------------------------------------------------------------
# 2. 系统依赖（apt）：一行一个
# ------------------------------------------------------------
APT_PACKAGES=(
  ca-certificates
  curl
  jq
  wget
  tar
  xz-utils
  mosquitto
)

# ------------------------------------------------------------
# 3. 常用软件快捷开关（true / false）
#    开启后自动从官方发布下载安装（无需 apt）
# ------------------------------------------------------------
INSTALL_7Z=true

# ------------------------------------------------------------
# 4. Python 依赖（pip 包）：一行一个
#    非空时会自动安装 Python3，再用 pip 安装这些包
# ------------------------------------------------------------
PYTHON_PACKAGES=(
  fastapi
  "uvicorn[standard]"
  paho-mqtt
  pydantic
)

# ------------------------------------------------------------
# 5. 自定义安装脚本（构建时执行一次）
#    适用于 apt / pip 装不了的东西：下载二进制、编译安装等
#    具体命令写在 install/custom-install.sh 里
#    该脚本内可用 ${TARGETARCH} 区分架构（amd64 / arm64）
# ------------------------------------------------------------
INSTALL_CUSTOM=true

# ------------------------------------------------------------
# 6. 日志模块（构建时下载，安装到 /opt/startup/log.sh）
#    来源：xct258/common 仓库，固定到提交 SHA（raw 的分支地址有缓存）
#    提供 log <级别> <消息>：写文件 + 打印到控制台
#    留空则镜像里没有 log.sh，容器启动会直接失败（start.sh 检查后 exit 1）
# ------------------------------------------------------------
LOG_LIB_URL=https://raw.githubusercontent.com/xct258/common/3d48863b2ba5c1de4cfacaa77993e35c77d3d675/%E8%84%9A%E6%9C%AC%E5%B7%A5%E5%85%B7/shell/%E6%97%A5%E5%BF%97%E8%AE%B0%E5%BD%95%E5%92%8C%E6%8E%A8%E9%80%81/log.sh
