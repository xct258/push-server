services:
  push-server:
    container_name: push-server
    image: xct258/push-server:latest
    network_mode: host
    restart: unless-stopped
    # 多进程容器用 tini 回收孤儿进程
    init: true
    # 停止 mqtt + api 的总时间大于默认 10s
    stop_grace_period: 30s
    volumes:
      # 应用代码、前端产物、推送记录、定时任务和日志都放在 /data
      - ./data:/data
    environment:
      # mqtt 的 ws 端口
      - MQTT_WS_PORT=${MQTT_WS_PORT:-9001}
      # fastapi 的端口
      - UVICORN_PORT=${UVICORN_PORT:-8383}
      # 统一登录（SSO）：本服务不再提供本地登录，校验 auth-server 的 Cookie
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - APP_SECRET=${APP_SECRET:-}
      - SSO_LOGIN_URL=${SSO_LOGIN_URL:-}
      - SSO_COOKIE_NAME=${SSO_COOKIE_NAME:-sso_session}
      - SSO_COOKIE_DOMAIN=${SSO_COOKIE_DOMAIN:-}
      - PUSH_SERVER_TOKEN=${PUSH_SERVER_TOKEN:-}
      - PRESENCE_TTL_SECONDS=${PRESENCE_TTL_SECONDS:-180}
      # 模板日志与服务摘要
      - LOG_BASE_DIR=/data/logs
      - SERVICE_PORT=${UVICORN_PORT:-8383}
