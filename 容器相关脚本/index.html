<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MQTT 推送中心</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
:root {
  --bg: #0d1117;
  --bg-panel: #161b22;
  --bg-elev: #1c2128;
  --border: #21262d;
  --border-strong: #30363d;
  --text: #c9d1d9;
  --text-hi: #e6edf3;
  --text-dim: #8b949e;
  --text-faint: #484f58;
  --accent: #58a6ff;
  --accent-hi: #79c0ff;
  --accent-soft: rgba(88, 166, 255, .12);
  --green: #3fb950;
  --green-soft: rgba(63, 185, 80, .12);
  --red: #f85149;
  --red-soft: rgba(248, 81, 73, .12);
  --orange: #f0883e;
  --orange-soft: rgba(240, 136, 62, .14);
  --radius: 12px;
  --radius-sm: 8px;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
  --shadow: 0 10px 30px rgba(0, 0, 0, .42);
  --focus: 0 0 0 3px rgba(88, 166, 255, .35);
  --mono: 'SF Mono', 'Menlo', 'JetBrains Mono', 'Fira Code', monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; color-scheme: dark; }
body { font-family: var(--sans); color: var(--text); background-color: var(--bg); background-image: radial-gradient(1100px 520px at 50% -220px, #131c28 0%, var(--bg) 60%); background-attachment: fixed; min-height: 100vh; }
* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #484f58; }
::-webkit-scrollbar-corner { background: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input:focus-visible { outline: none; }

.header { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; min-height: 60px; padding: 10px 18px; background: rgba(22, 27, 34, .82); backdrop-filter: saturate(180%) blur(14px); -webkit-backdrop-filter: saturate(180%) blur(14px); border-bottom: 1px solid var(--border); }
.header h1 { display: flex; align-items: center; line-height: 1; font-size: 17px; font-weight: 650; letter-spacing: .2px; color: var(--text-hi); white-space: nowrap; flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.header h1::before { content: ''; width: 4px; height: 18px; border-radius: 2px; margin-right: 10px; background: linear-gradient(180deg, var(--accent), #a371f7); flex-shrink: 0; }
.header h1 small { font-weight: 400; font-size: 12.5px; color: var(--text-dim); margin-left: 10px; }
.header .info { display: flex; align-items: center; gap: 12px; margin-left: auto; flex-shrink: 0; font-size: 12px; color: var(--text-dim); line-height: 1; }
.header .info .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; flex-shrink: 0; box-shadow: 0 0 0 0 rgba(63, 185, 80, .5); animation: live 2.2s ease-out infinite; transition: background .3s; }
.header .info .dot.stopped { background: var(--red); animation: none; }
@keyframes live { 0% { box-shadow: 0 0 0 0 rgba(63, 185, 80, .45); } 70% { box-shadow: 0 0 0 7px rgba(63, 185, 80, 0); } 100% { box-shadow: 0 0 0 0 rgba(63, 185, 80, 0); } }
#count-label { white-space: nowrap; }
.header-filters { display: flex; align-items: center; gap: 8px 14px; flex: 0 1 auto; min-width: 0; }
.filter-field { display: flex; align-items: center; gap: 6px; flex: 0 1 auto; min-width: 0; }
.filter-field label { font-size: 12.5px; color: var(--text-dim); white-space: nowrap; flex-shrink: 0; line-height: 1; }
.filter-field .combo { flex: 0 1 150px; min-width: 90px; }

.btn-clear { padding: 5px 12px; border: 1px solid var(--border-strong); border-radius: 999px; background: transparent; color: var(--text-dim); font-size: 12px; cursor: pointer; flex-shrink: 0; transition: color .15s, border-color .15s, background .15s; }
.btn-clear:hover { color: var(--red); border-color: rgba(248, 81, 73, .5); background: var(--red-soft); }
.btn-clear[hidden] { display: none; }

.new-hint { display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px; border: none; border-radius: 999px; background: var(--green); color: #06210f; font-size: 12px; font-weight: 650; cursor: pointer; white-space: nowrap; animation: hintIn .3s ease, pulse 1.4s .3s ease-in-out infinite; }
.new-hint:hover { background: #56d364; }
.new-hint[hidden] { display: none; }
@keyframes hintIn { from { opacity: 0; transform: translateY(-6px); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .65; } }

.container { max-width: 1100px; margin: 0 auto; padding: 22px 20px 64px; }

.combo { position: relative; display: inline-block; }
.combo input { width: 100%; height: 34px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: #0d1117; color: var(--text); font-size: 13px; outline: none; cursor: default; transition: border-color .15s, background .15s, box-shadow .15s; }
.combo input:hover { border-color: #484f58; }
.combo input:focus { border-color: var(--accent); box-shadow: var(--focus); background: #0b1220; }
.combo input.has-value { padding-right: 30px; }
.combo.active input { border-color: var(--accent); background: #0b1220; }
.combo input::placeholder { color: var(--text-faint); }
.combo-clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; border-radius: 50%; border: none; background: var(--border-strong); color: var(--text); font-size: 12px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; transition: background .15s; }
.combo-clear:hover { background: #484f58; color: #fff; }
.combo-clear[hidden] { display: none; }
.combo-dropdown { position: fixed; left: 0; top: 0; width: 150px; max-height: 240px; overflow-y: auto; display: none; z-index: 1000; background: #161b22; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); box-shadow: var(--shadow); transition: opacity .12s ease, transform .12s ease; }
.combo-bridge { position: fixed; display: none; z-index: 999; }
.combo-dropdown.open { display: block; }
.combo-dropdown div { padding: 7px 12px; font-size: 13px; cursor: pointer; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background .1s; }
.combo-dropdown div:hover { background: var(--bg-elev); color: var(--accent); }
.combo-dropdown div.highlighted { background: var(--bg-elev); color: var(--accent); }
.combo-dropdown .empty-hint { color: var(--text-faint); cursor: default; }
.combo-dropdown .empty-hint:hover { background: transparent; color: var(--text-faint); }
.combo-dropdown .all-option { color: var(--text-dim); border-bottom: 1px solid var(--border); margin-bottom: 2px; }
.combo-dropdown .all-option:hover { color: var(--accent); }
.combo-dropdown .selected::before { content: '✓ '; color: var(--green); }
.combo-dropdown strong { color: var(--orange); font-weight: 600; }

.card-list { display: flex; flex-direction: column; gap: 14px; }
.card { position: relative; background: linear-gradient(180deg, #171d26 0%, var(--bg-panel) 60%); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: border-color .18s, box-shadow .18s; animation: cardIn .3s ease backwards; }
.card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
@keyframes cardIn { from { opacity: 0; transform: translateY(8px); } }

.card-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.card-left { display: flex; align-items: center; gap: 8px; min-width: 0; }

.topic-tag { background: var(--accent-soft); padding: 3px 10px; border-radius: 6px; font-family: var(--mono); font-size: 12px; color: var(--accent-hi); user-select: text; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; transition: background .15s, transform .1s; }
.topic-tag:hover { background: rgba(88, 166, 255, .2); }
.topic-tag:active { transform: scale(.96); }
.mode-badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 500; flex-shrink: 0; }
.mode-append { background: var(--bg-elev); color: var(--text-dim); }
.mode-overwrite { background: var(--orange-soft); color: var(--orange); }

.btn-copy { background: var(--bg-elev); border: 1px solid var(--border-strong); color: var(--text-dim); padding: 5px 12px; border-radius: var(--radius-sm); font-size: 12px; cursor: pointer; transition: background .15s, color .15s, border-color .15s, transform .1s; }
.btn-copy:hover { color: var(--text-hi); background: var(--border-strong); }
.btn-copy:active { transform: scale(.96); }
.btn-copy.copied { color: var(--green) !important; border-color: var(--green) !important; opacity: 1 !important; }
.card-msg { position: relative; max-height: 240px; overflow: hidden; transition: max-height .28s ease; }
.card-msg .btn-copy { position: absolute; top: 10px; right: 10px; z-index: 1; opacity: .72; background: rgba(22, 27, 34, .9); backdrop-filter: blur(4px); border: 1px solid var(--border-strong); color: var(--text-dim); padding: 4px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; transition: opacity .15s, color .15s, background .15s, transform .1s; }
.card-msg .btn-copy:hover { opacity: 1; color: var(--text-hi); background: rgba(48, 54, 61, .95); }
@media (hover: hover) {
  .card-msg .btn-copy { opacity: 0; }
  .card:hover .card-msg .btn-copy { opacity: .85; }
  .card-msg .btn-copy:hover { opacity: 1; }
}
.card-msg.clamped::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 48px; background: linear-gradient(transparent, var(--bg-panel)); pointer-events: none; }
.card-msg.expanded { max-height: none; }
.card-msg-inner { padding: 13px 16px; font-size: 13px; line-height: 1.65; word-break: break-word; user-select: text; }
.card-msg-inner p { margin: 0 0 6px; }
.card-msg-inner p:last-child { margin-bottom: 0; }
.card-msg-inner code { background: var(--bg-elev); padding: 1px 5px; border-radius: 3px; font-size: 12px; }
.card-msg-inner pre { background: #0b1220; padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 12px; border: 1px solid var(--border); }
.card-msg-inner img { max-width: 100%; border-radius: 4px; }
.card-msg-inner a { color: var(--accent); }
.card-msg-inner ul, .card-msg-inner ol { padding-left: 20px; margin-bottom: 6px; }
.card-msg-inner table { font-size: 12px; border-collapse: collapse; }
.card-msg-inner th, .card-msg-inner td { padding: 4px 8px; border: 1px solid var(--border-strong); }
.card-msg-inner blockquote { border-left: 3px solid var(--border-strong); padding-left: 12px; color: var(--text-dim); margin: 4px 0 6px; }

.card-meta { display: flex; align-items: center; gap: 8px 16px; padding: 9px 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-dim); flex-wrap: wrap; min-height: 36px; }
.meta-server { color: var(--text); cursor: pointer; user-select: text; transition: color .15s; }
.meta-server:hover { color: var(--accent); }
.meta-time { color: var(--text-faint); }
.meta-push { margin-left: auto; cursor: pointer; padding: 4px 12px; border-radius: 999px; font-size: 11.5px; border: 1px solid transparent; user-select: none; transition: background .15s, border-color .15s, color .15s, filter .15s; }
.meta-push.success { color: var(--green); border-color: rgba(63, 185, 80, .35); background: var(--green-soft); }
.meta-push.failed { color: var(--red); border-color: rgba(248, 81, 73, .35); background: var(--red-soft); }
.meta-push.skipped { color: var(--orange); border-color: rgba(240, 136, 62, .35); background: var(--orange-soft); }
.meta-push:hover:not(.busy) { filter: brightness(1.18); }
.meta-push.busy { opacity: .6; cursor: default; }
.btn-toggle-msg { background: transparent; border: none; color: var(--accent); font-size: 12px; cursor: pointer; padding: 2px 4px; border-radius: 4px; }
.btn-toggle-msg:hover { color: var(--accent-hi); }

.btn-page { background: var(--bg-panel); border: 1px solid var(--border-strong); color: var(--accent); padding: 9px 18px; border-radius: var(--radius-sm); font-size: 13px; cursor: pointer; transition: background .15s, color .15s, border-color .15s, transform .1s; }
.btn-page:hover:not(:disabled) { background: var(--bg-elev); color: var(--accent-hi); border-color: var(--accent); }
.btn-page:active:not(:disabled) { transform: scale(.97); }
.btn-page:disabled { opacity: .35; cursor: default; }
.pager { display: flex; justify-content: center; align-items: center; gap: 16px; padding: 10px 0; flex-wrap: wrap; }
.pager-info { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; }
.pager-chip { background: var(--accent-soft); border: 1px solid rgba(88, 166, 255, .25); color: var(--accent-hi); padding: 2px 9px; border-radius: 999px; font-size: 11px; animation: chipIn .2s ease; }
@keyframes chipIn { from { opacity: 0; transform: scale(.9); } }

.state-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); text-align: center; padding: 56px 20px; color: var(--text-faint); }
.state-card .icon { font-size: 40px; margin-bottom: 12px; }
.state-card p { font-size: 14px; }
.state-card .spinner { display: inline-block; width: 26px; height: 26px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.skeleton-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.sk { background: linear-gradient(90deg, #1c2128 25%, #272f3b 37%, #1c2128 63%); background-size: 400% 100%; border-radius: 6px; animation: shimmer 1.4s ease infinite; }
.sk-line { height: 12px; margin-bottom: 12px; }
.sk-line:last-child { margin-bottom: 0; }
.sk-w40 { width: 40%; }
.sk-w60 { width: 60%; }
.sk-block { height: 72px; margin: 12px 0; border-radius: 8px; }
@keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

.tabs { display: flex; gap: 6px; flex-shrink: 0; }
.tab-btn { padding: 6px 14px; border: 1px solid var(--border-strong); border-radius: 999px; background: transparent; color: var(--text-dim); font-size: 12.5px; cursor: pointer; white-space: nowrap; transition: color .15s, border-color .15s, background .15s; }
.tab-btn:hover { color: var(--text-hi); border-color: #484f58; }
.tab-btn.active { background: var(--accent-soft); border-color: rgba(88, 166, 255, .45); color: var(--accent-hi); font-weight: 600; }
.tab-btn .cnt { font-size: 11px; opacity: .85; }
.tpills { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.header-filters[hidden], .tpills[hidden] { display: none; }
.tpill { padding: 4px 11px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); font-size: 11.5px; cursor: pointer; transition: color .15s, border-color .15s, background .15s; }
.tpill:hover { color: var(--text-hi); border-color: #484f58; }
.tpill.active { background: var(--bg-elev); color: var(--text-hi); border-color: var(--border-strong); }
.st-badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; flex-shrink: 0; }
.st-pending { background: var(--accent-soft); color: var(--accent-hi); }
.st-sent { background: var(--orange-soft); color: var(--orange); }
.st-done { background: var(--green-soft); color: var(--green); }
.st-cancelled { background: var(--bg-elev); color: var(--text-faint); }
.task-title { font-weight: 600; color: var(--text-hi); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-actions { margin-left: auto; display: flex; gap: 6px; flex-shrink: 0; }
.btn-act { padding: 4px 12px; border-radius: 999px; font-size: 11.5px; cursor: pointer; border: 1px solid var(--border-strong); background: var(--bg-elev); color: var(--text-dim); transition: color .15s, border-color .15s, background .15s; }
.btn-act:hover { color: var(--text-hi); border-color: #484f58; }
.btn-act.done:hover { color: var(--green); border-color: rgba(63, 185, 80, .5); }
.btn-act.cancel:hover { color: var(--red); border-color: rgba(248, 81, 73, .5); }
.btn-act.busy { opacity: .6; cursor: default; }
.meta-cb { color: var(--text-faint); }
.meta-cb.ok { color: var(--green); }
.meta-cb.warn { color: var(--orange); }
.meta-cb.bad { color: var(--red); }

@media (max-width: 960px) {
  .header h1 { flex: 1 1 100%; font-size: 15px; }
}
@media (max-width: 680px) {
  .header { padding: 10px 12px; gap: 8px 10px; }
  .header h1 { font-size: 14px; }
  .header h1::before { height: 15px; margin-right: 8px; }
  .header h1 small { display: none; }
  .header-filters { flex: 1 1 100%; gap: 8px 10px; }
  .filter-field { flex: 1 1 100%; }
  .filter-field .combo { flex: 1 1 auto; }
  .combo input { height: 40px; font-size: 14px; }
  .header .info { flex: 1 1 100%; margin-left: 0; justify-content: space-between; gap: 8px; }
  .container { padding: 12px 12px calc(52px + env(safe-area-inset-bottom, 0px)); }
  .card-list { gap: 10px; }
  .card-top { padding: 11px 13px; }
  .card-msg { max-height: 200px; }
  .card-msg-inner { padding: 12px 13px; }
  .card-meta { padding: 9px 13px; gap: 8px 12px; font-size: 11.5px; }
  .meta-push { padding: 6px 13px; }
  .btn-copy { padding: 7px 13px; }
  .card-msg .btn-copy { padding: 5px 11px; }
  .pager { gap: 8px; }
  .pager-info { flex: 1 1 100%; order: -1; }
  .btn-page { flex: 1 1 auto; text-align: center; padding: 11px 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="header">
  <h1>MQTT 推送中心 <small id="view-sub">推送记录</small></h1>
  <div class="tabs">
    <button class="tab-btn active" id="tab-records">推送记录</button>
    <button class="tab-btn" id="tab-tasks">定时任务<span class="cnt" id="task-pending-count"></span></button>
  </div>
  <div class="tpills" id="task-pills" hidden>
    <button class="tpill active" data-tstatus="">全部</button>
    <button class="tpill" data-tstatus="pending">待推送</button>
    <button class="tpill" data-tstatus="sent">已发送</button>
    <button class="tpill" data-tstatus="done">已完成</button>
    <button class="tpill" data-tstatus="cancelled">已取消</button>
  </div>
  <div class="header-filters">
    <div class="filter-field">
      <label for="filter-server">服务器</label>
      <div class="combo" id="combo-server">
        <input type="text" id="filter-server" placeholder="全部" autocomplete="off" data-bwignore>
        <button class="combo-clear" id="clear-server" hidden>×</button>
        <div class="combo-dropdown" id="drop-server"></div>
      </div>
    </div>
    <div class="filter-field">
      <label for="filter-topic">主题</label>
      <div class="combo" id="combo-topic">
        <input type="text" id="filter-topic" placeholder="全部" autocomplete="off" data-bwignore>
        <button class="combo-clear" id="clear-topic" hidden>×</button>
        <div class="combo-dropdown" id="drop-topic"></div>
      </div>
    </div>
  </div>
  <div class="info">
    <span class="dot" id="status-dot"></span>
    <span id="count-label">加载中...</span>
    <button class="btn-clear" id="btn-clear" hidden>清除筛选</button>
    <button class="new-hint" id="new-hint" hidden>有新消息，点击刷新</button>
  </div>
</div>
<div class="container">
  <div class="card-list" id="card-list">
    <div class="skeleton-card"><div class="sk sk-line sk-w40"></div><div class="sk sk-block"></div><div class="sk sk-line sk-w60"></div></div>
    <div class="skeleton-card"><div class="sk sk-line sk-w40"></div><div class="sk sk-block"></div><div class="sk sk-line sk-w60"></div></div>
    <div class="skeleton-card"><div class="sk sk-line sk-w40"></div><div class="sk sk-block"></div><div class="sk sk-line sk-w60"></div></div>
  </div>
  <div id="list-footer"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script>
const INPUT_DELAY = 200;
const PAGE = 10;
let filterServer = '';
let filterTopic = '';
let serverOptions = [];
let topicOptions = [];
let loadTimer = null;
let lastFingerprint = '';
let currentPage = 1;
let lastTotal = null;
let newCount = 0;
let currentAbort = null;
const expandedMsgs = new Set();

const mdCache = new Map();
const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ESC_MAP[c]);
}

function comboSetup(inputId, dropId, clearId, onChange) {
  const input = document.getElementById(inputId);
  const drop = document.getElementById(dropId);
  const clearBtn = document.getElementById(clearId);
  let highlightedIdx = -1;

  function updateState() {
    const has = !!input.value;
    clearBtn.hidden = !has;
    input.classList.toggle('has-value', has);
    input.closest('.combo').classList.toggle('active', has);
  }

  drop.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (drop.scrollHeight > drop.clientHeight + 1) {
      const px = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaMode === 2 ? e.deltaY * window.innerHeight : e.deltaY;
      drop.scrollTop += px;
    }
  }, { passive: false });

  let closeTimer = null;
  let hideTimer = null;
  const bridge = document.createElement('div');
  bridge.className = 'combo-bridge';
  document.body.appendChild(bridge);

  function showDropdown() {
    clearTimeout(hideTimer);
    const rect = input.getBoundingClientRect();
    drop.style.top = (rect.bottom + 4) + 'px';
    drop.style.left = rect.left + 'px';
    drop.style.width = rect.width + 'px';
    bridge.style.top = rect.bottom + 'px';
    bridge.style.left = rect.left + 'px';
    bridge.style.width = rect.width + 'px';
    bridge.style.height = '4px';
    bridge.style.display = 'block';
    drop.classList.add('open');
    drop.style.opacity = '0';
    drop.style.transform = 'translateY(-4px)';
    requestAnimationFrame(() => {
      drop.style.opacity = '1';
      drop.style.transform = 'none';
    });
  }

  window.addEventListener('resize', () => {
    if (drop.classList.contains('open')) showDropdown();
  });
  window.addEventListener('scroll', () => {
    if (drop.classList.contains('open')) showDropdown();
  }, { passive: true });

  function hideDropdown() {
    clearTimeout(closeTimer);
    clearTimeout(hideTimer);
    bridge.style.display = 'none';
    drop.style.opacity = '0';
    drop.style.transform = 'translateY(-4px)';
    hideTimer = setTimeout(() => {
      drop.classList.remove('open');
      highlightedIdx = -1;
    }, 120);
  }

  function scheduleClose() {
    clearTimeout(closeTimer);
    closeTimer = setTimeout(hideDropdown, 120);
  }

  window.addEventListener('options-updated', () => {
    if (drop.classList.contains('open')) renderOptions(input.value);
  });

  bridge.addEventListener('mouseenter', () => { clearTimeout(closeTimer); });
  bridge.addEventListener('mouseleave', (e) => {
    if (e.relatedTarget && (input.contains(e.relatedTarget) || drop.contains(e.relatedTarget))) return;
    scheduleClose();
  });

  function renderOptions(filter) {
    const opts = dropId === 'drop-server' ? serverOptions : topicOptions;
    let matched = opts.slice();
    let hlRe = null;
    if (filter) {
      try {
        const re = new RegExp(filter, 'i');
        matched = opts.filter(v => re.test(v));
        hlRe = new RegExp('((?:' + filter + '))', 'gi');
      } catch (e) {
        const q = filter.toLowerCase();
        matched = opts.filter(v => v.toLowerCase().includes(q));
        hlRe = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      }
    }
    let html = '<div class="all-option' + (filter === '' ? ' selected' : '') + '">全部</div>';
    if (matched.length === 0) {
      html += '<div class="empty-hint">无匹配</div>';
    } else {
      html += matched.map(v => {
        const text = esc(v);
        const cls = v === filter ? ' selected' : '';
        return '<div class="' + cls.trim() + '" title="' + text + '">' +
          (hlRe ? text.replace(hlRe, '<strong>$1</strong>') : text) + '</div>';
      }).join('');
    }
    drop.innerHTML = html;
    highlightedIdx = -1;
  }

  function commit(value) {
    input.value = value;
    updateState();
    onChange(value);
  }

  clearBtn.addEventListener('mousedown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    commit('');
    renderOptions(input.value);
  });

  input.addEventListener('mouseleave', (e) => {
    if (e.relatedTarget && (drop.contains(e.relatedTarget) || e.relatedTarget === bridge)) return;
    if (drop.matches(':hover')) return;
    scheduleClose();
  });

  input.addEventListener('mouseenter', () => {
    clearTimeout(closeTimer);
    if (document.activeElement === input && !drop.classList.contains('open')) {
      renderOptions(input.value);
      showDropdown();
    }
  });

  input.addEventListener('focus', () => {
    renderOptions(input.value);
    showDropdown();
  });

  input.addEventListener('input', () => {
    updateState();
    renderOptions(input.value);
    showDropdown();
    clearTimeout(loadTimer);
    loadTimer = setTimeout(() => { onChange(input.value); }, INPUT_DELAY);
  });

  input.addEventListener('keydown', (e) => {
    const items = drop.querySelectorAll('div:not(.empty-hint):not(.all-option)');
    if (e.key === 'ArrowDown') {
      e.preventDefault(); highlightedIdx = Math.min(highlightedIdx + 1, items.length - 1);
      items.forEach((el, i) => el.classList.toggle('highlighted', i === highlightedIdx));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault(); highlightedIdx = Math.max(highlightedIdx - 1, 0);
      items.forEach((el, i) => el.classList.toggle('highlighted', i === highlightedIdx));
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (highlightedIdx >= 0 && items[highlightedIdx]) {
        commit(items[highlightedIdx].textContent);
      }
      hideDropdown();
      onChange(input.value);
    } else if (e.key === 'Escape') {
      if (drop.classList.contains('open')) {
        hideDropdown();
      } else if (input.value) {
        commit('');
      }
    }
  });

  drop.addEventListener('mouseleave', (e) => {
    if (e.relatedTarget && (input.contains(e.relatedTarget) || e.relatedTarget === bridge)) return;
    if (input.matches(':hover')) return;
    scheduleClose();
  });

  drop.addEventListener('mouseenter', () => {
    clearTimeout(closeTimer);
  });

  drop.addEventListener('mousedown', (e) => {
    const rect = drop.getBoundingClientRect();
    const sbw = drop.offsetWidth - drop.clientWidth || 14;
    if (e.clientX > rect.right - sbw - 2) return;
    const div = e.target.closest('div');
    if (div && div.classList.contains('all-option')) {
      commit('');
      hideDropdown();
      return;
    }
    if (div && !div.classList.contains('empty-hint')) {
      commit(div.textContent);
      hideDropdown();
    }
  });

  document.addEventListener('click', (e) => {
    if (!input.closest('.combo').contains(e.target)) hideDropdown();
  });
}

function applyFilters() {
  filterServer = document.getElementById('filter-server').value;
  filterTopic = document.getElementById('filter-topic').value;
  updateClearBtn();
  refresh();
}

function updateClearBtn() {
  document.getElementById('btn-clear').hidden = !(filterServer || filterTopic);
}

function showNewHint() {
  const hint = document.getElementById('new-hint');
  hint.textContent = '有 ' + newCount + ' 条新消息，点击刷新';
  hint.hidden = false;
}

function loadNew() {
  document.getElementById('new-hint').hidden = true;
  refresh();
}

function refresh() {
  currentPage = 1;
  loadData();
  updateOptionsAll();
}

async function updateOptionsAll() {
  try {
    const all = [];
    let offset = 0;
    while (true) {
      const params = new URLSearchParams({ limit: 500 });
      if (filterServer) params.set('server_name', filterServer);
      if (filterTopic) params.set('topic', filterTopic);
      const res = await fetch('/records?' + params.toString() + '&offset=' + offset);
      if (!res.ok) break;
      const data = await res.json();
      all.push(...data.records);
      if (all.length >= data.total || data.records.length === 0) break;
      offset += data.records.length;
    }
    serverOptions = [...new Set(all.map(r => r.server_name).filter(Boolean))].sort();
    topicOptions = [...new Set(all.map(r => r.topic).filter(Boolean))].sort();
    window.dispatchEvent(new CustomEvent('options-updated'));
  } catch (e) { /* 静默失败，选项保持现状 */ }
}

async function loadData() {
  if (document.hidden) return;
  if (currentAbort) currentAbort.abort();
  const abort = new AbortController();
  currentAbort = abort;
  const countLabel = document.getElementById('count-label');
  if (currentPage === 1 && lastFingerprint) countLabel.textContent = '刷新中...';

  const params = new URLSearchParams({ limit: PAGE, offset: (currentPage - 1) * PAGE });
  if (filterServer) params.set('server_name', filterServer);
  if (filterTopic) params.set('topic', filterTopic);

  try {
    const res = await fetch('/records?' + params.toString(), { signal: abort.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    updateCount(data.total);
    updateOptions(data.records);

    if (currentPage === 1) {
      const fp = fingerprint(data);
      if (fp !== lastFingerprint) {
        lastFingerprint = fp;
        renderCards(data.records);
      }
    } else {
      renderCards(data.records);
    }
    renderPager(data.total);
  } catch (e) {
    if (e.name === 'AbortError') return;
    countLabel.textContent = '连接失败';
    document.getElementById('status-dot').className = 'dot stopped';
    if (currentPage === 1) {
      if (!lastFingerprint) renderState('🔌', '无法连接到服务器');
    } else {
      document.getElementById('list-footer').innerHTML =
        '<button class="btn-page" id="btn-retry">加载失败，点击重试</button>';
    }
  } finally {
    if (currentAbort === abort) currentAbort = null;
  }
}

function fingerprint(data) {
  let s = data.total + '|';
  for (const r of data.records) {
    s += r.id + ':' + r.server_name + ':' + r.topic + ':' + r.created_at + ':' +
         r.mode + ':' + (r.push_to_mqtt ? 1 : 0) + ':' + r.message + ';';
  }
  return s;
}

function updateCount(total) {
  const countLabel = document.getElementById('count-label');
  countLabel.textContent = (filterServer || filterTopic) ? '筛选出 ' + total + ' 条' : '共 ' + total + ' 条';
  document.getElementById('status-dot').className = 'dot';
  lastTotal = total;
  newCount = 0;
  document.getElementById('new-hint').hidden = true;
}

function updateOptions(records) {
  const allServers = new Set(serverOptions);
  const allTopics = new Set(topicOptions);
  for (const r of records) {
    if (r.server_name) allServers.add(r.server_name);
    if (r.topic) allTopics.add(r.topic);
  }
  serverOptions = [...allServers].sort();
  topicOptions = [...allTopics].sort();
}

function renderCards(records) {
  const list = document.getElementById('card-list');
  if (records.length === 0) {
    renderState('📭', (filterServer || filterTopic) ? '无匹配的推送记录' : '暂无推送记录');
    return;
  }
  list.innerHTML = records.map(cardHtml).join('');
  postRender();
}

function renderState(icon, text) {
  document.getElementById('card-list').innerHTML =
    '<div class="state-card"><div class="icon">' + icon + '</div><p>' + text + '</p></div>';
}

function cardHtml(r) {
  const ps = r.push_result || (r.push_to_mqtt ? 'success' : 'skipped');
  const pushTip = ps === 'success' ? '推送成功，点击重新推送'
    : ps === 'failed' ? '推送失败，点击重试'
    : '未推送 MQTT，点击手动推送';
  return '<div class="card" data-id="' + r.id + '">' +
    '<div class="card-top">' +
      '<div class="card-left">' +
        '<span class="topic-tag" data-filter="topic" title="点击筛选该主题">' + esc(r.topic) + '</span>' +
        '<span class="mode-badge mode-' + (r.mode || 'append') + '">' + (r.mode === 'overwrite' ? '覆盖' : '持续') + '</span>' +
      '</div>' +
    '</div>' +
    '<div class="card-msg">' +
      '<button class="btn-copy" data-msg="' + esc(r.message) + '" title="复制消息原文">复制</button>' +
      '<div class="card-msg-inner">' + renderMd(r.topic, r.message) + '</div>' +
    '</div>' +
    '<div class="card-meta">' +
      '<span class="meta-server" data-filter="server" title="点击筛选该服务器">' + esc(r.server_name || '-') + '</span>' +
      '<span class="meta-time">' + esc(r.created_at) + '</span>' +
      '<span class="meta-push ' + ps + '" data-repush="1" data-server="' + esc(r.server_name) + '" data-id="' + r.id + '" title="' + pushTip + '">重新推送 MQTT</span>' +
    '</div>' +
  '</div>';
}

function postRender() {
  document.querySelectorAll('.card').forEach((card, i) => {
    card.style.animationDelay = (i * 30) + 'ms';
    const msg = card.querySelector('.card-msg');
    const inner = msg.querySelector('.card-msg-inner');
    const id = Number(card.dataset.id);
    let btn = card.querySelector('.btn-toggle-msg');
    if (inner.scrollHeight > msg.clientHeight + 2) {
      msg.classList.add('clamped');
      if (!btn) {
        btn = document.createElement('button');
        btn.className = 'btn-toggle-msg';
        card.querySelector('.card-meta').appendChild(btn);
      }
      const expanded = expandedMsgs.has(id);
      msg.classList.toggle('expanded', expanded);
      if (expanded) msg.style.maxHeight = inner.scrollHeight + 'px';
      btn.textContent = expanded ? '收起' : '展开全文';
    } else {
      msg.classList.remove('clamped', 'expanded');
      msg.style.maxHeight = '';
      if (btn) btn.remove();
    }
  });
}

function toggleMsg(card) {
  const msg = card.querySelector('.card-msg');
  const btn = card.querySelector('.btn-toggle-msg');
  const id = Number(card.dataset.id);
  const fullH = msg.scrollHeight;
  if (msg.classList.contains('expanded')) {
    msg.style.maxHeight = fullH + 'px';
    msg.classList.remove('expanded');
    requestAnimationFrame(() => { msg.style.maxHeight = '240px'; });
    btn.textContent = '展开全文';
    expandedMsgs.delete(id);
  } else {
    msg.style.maxHeight = '240px';
    msg.classList.add('expanded');
    requestAnimationFrame(() => { msg.style.maxHeight = fullH + 'px'; });
    btn.textContent = '收起';
    expandedMsgs.add(id);
  }
}

function renderPager(total) {
  const footer = document.getElementById('list-footer');
  if (total === 0) { footer.innerHTML = ''; return; }
  const totalPages = Math.max(1, Math.ceil(total / PAGE));
  let chips = '';
  if (filterServer) chips += '<span class="pager-chip">服务器: ' + esc(filterServer) + '</span>';
  if (filterTopic) chips += '<span class="pager-chip">主题: ' + esc(filterTopic) + '</span>';
  footer.innerHTML =
    '<div class="pager">' +
      '<button class="btn-page" id="btn-prev"' + (currentPage <= 1 ? ' disabled' : '') + '>‹ 上一页</button>' +
      '<span class="pager-info">' + chips + '<span>第 ' + currentPage + ' / ' + totalPages + ' 页 · 共 ' + total + ' 条</span></span>' +
      '<button class="btn-page" id="btn-next"' + (currentPage >= totalPages ? ' disabled' : '') + '>下一页 ›</button>' +
    '</div>';
}

function renderMd(topic, text) {
  const key = topic + '\u0000' + text;
  const hit = mdCache.get(key);
  if (hit !== undefined) return hit;
  let html;
  if (window.marked && window.DOMPurify) {
    try {
      html = DOMPurify.sanitize(marked.parse(text, { breaks: true, gfm: true }));
    } catch (e) {
      html = esc(text).replace(/\n/g, '<br>');
    }
  } else {
    html = esc(text).replace(/\n/g, '<br>');
  }
  if (mdCache.size > 500) mdCache.clear();
  mdCache.set(key, html);
  return html;
}

function mdToText(text) {
  if (window.marked && window.DOMPurify) {
    const div = document.createElement('div');
    div.innerHTML = DOMPurify.sanitize(marked.parse(text, { breaks: true, gfm: true }));
    return div.textContent;
  }
  return text;
}

function copyTextFallback(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.top = '-100px';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, ta.value.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  return ok;
}

async function copyText(btn) {
  const old = btn.textContent;
  const text = mdToText(btn.dataset.msg);
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch (e) {
    ok = copyTextFallback(text);
  }
  btn.textContent = ok ? '✓ 已复制' : '复制失败';
  btn.classList.toggle('copied', ok);
  setTimeout(() => { btn.textContent = old; btn.classList.remove('copied'); }, 1500);
}

async function repush(el) {
  if (el.classList.contains('busy')) return;
  el.classList.add('busy');
  el.textContent = '推送中...';
  try {
    const res = await fetch('/api/repush', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ server_name: el.dataset.server, id: Number(el.dataset.id) }),
    });
    if (res.ok) {
      el.textContent = '✓ 已推送';
      el.classList.remove('failed', 'skipped');
      el.classList.add('success');
      el.title = '推送成功，点击重新推送';
      setTimeout(() => { el.textContent = '重新推送 MQTT'; el.classList.remove('busy'); }, 2000);
    } else {
      el.textContent = '推送失败';
      el.classList.add('failed');
      setTimeout(() => { el.textContent = '重新推送 MQTT'; el.classList.remove('busy'); }, 3000);
    }
  } catch (e) {
    el.textContent = '请求失败';
    el.classList.add('failed');
    setTimeout(() => { el.textContent = '重新推送 MQTT'; el.classList.remove('busy'); }, 3000);
  }
}

const cardList = document.getElementById('card-list');
cardList.addEventListener('click', (e) => {
  const t = e.target;
  const tdone = t.closest('[data-tdone]');
  if (tdone) { taskFeedback(tdone, 'done'); return; }

const btnClear = document.getElementById('btn-clear');
btnClear.addEventListener('mousedown', (e) => {
  e.preventDefault();
  e.stopPropagation();
});
btnClear.addEventListener('click', () => {

  for (const input of inputs) {

    input.closest('.combo').classList.remove('active');

    input.blur();
  }
  document.querySelectorAll('.combo-dropdown').forEach(d => d.classList.remove('open'));
  document.querySelectorAll('.combo-bridge').forEach(b => b.style.display = 'none');

});

document.getElementById('list-footer').addEventListener('click', (e) => {
  const retry = e.target.closest('#btn-retry');
  if (retry) { loadData(); return; }
  const prev = e.target.closest('#btn-prev');
  if (prev && !prev.disabled) { currentPage--; goPage(); return; }
  const next = e.target.closest('#btn-next');
  if (next && !next.disabled) { currentPage++; goPage(); }
});

function goPage() {
  window.scrollTo({ top: 0 });
  lastFingerprint = '';
  loadData();
}

const newHint = document.getElementById('new-hint');
newHint.addEventListener('click', loadNew);

/* ---------------- 定时任务视图 ---------------- */
let view = 'records';
let taskStatus = '';
let taskTimer = null;
let lastTasks = [];
const STATUS_META = {
  pending: ['待推送', 'st-pending'],
  sent: ['已发送', 'st-sent'],
  done: ['已完成', 'st-done'],
  cancelled: ['已取消', 'st-cancelled'],
};
const CB_META = {
  none: ['未回调', ''],
  pending: ['回调中', 'warn'],
  done: ['回调成功', 'ok'],
  failed: ['回调失败', 'bad'],
  skipped: ['跳过回调', ''],
};

function switchView(v) {
  view = v;
  document.getElementById('tab-records').classList.toggle('active', v === 'records');
  document.getElementById('tab-tasks').classList.toggle('active', v === 'tasks');
  document.getElementById('view-sub').textContent = v === 'tasks' ? '定时任务' : '推送记录';
  document.querySelector('.header-filters').hidden = v !== 'records';
  document.getElementById('task-pills').hidden = v !== 'tasks';
  document.getElementById('btn-clear').hidden = true;
  document.getElementById('list-footer').innerHTML = '';
  lastFingerprint = '';
  if (v === 'tasks') { loadTasks(); startTaskPoll(); }
  else { stopTaskPoll(); refresh(); }
}

function startTaskPoll() {
  stopTaskPoll();
  taskTimer = setInterval(() => { if (view === 'tasks' && !document.hidden) loadTasks(); }, 10000);
}
function stopTaskPoll() {
  if (taskTimer) { clearInterval(taskTimer); taskTimer = null; }
}

async function loadTasks() {
  if (document.hidden || view !== 'tasks') return;
  const countLabel = document.getElementById('count-label');
  try {
    const params = new URLSearchParams({ limit: 200 });
    if (taskStatus) params.set('status', taskStatus);
    const res = await fetch('/api/tasks?' + params.toString());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    lastTasks = data.tasks;
    const fp = 'tasks|' + data.tasks.map(t => t.task_id + ':' + t.status + ':' + t.schedule_at + ':' + t.updated_at).join(';');
    if (fp !== lastFingerprint) { lastFingerprint = fp; renderTaskCards(data.tasks); }
    updateCountdowns();
    const pend = data.tasks.filter(t => t.status === 'pending').length;
    countLabel.textContent = taskStatus ? '筛选出 ' + data.tasks.length + ' 个任务' : '共 ' + data.tasks.length + ' 个任务（' + pend + ' 待推送）';
    document.getElementById('task-pending-count').textContent = pend ? '（' + pend + '）' : '';
    document.getElementById('status-dot').className = 'dot';
  } catch (e) {
    countLabel.textContent = '连接失败';
    document.getElementById('status-dot').className = 'dot stopped';
    if (!lastFingerprint) renderState('🔌', '无法连接到服务器');
  }
}

function fmtSched(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  if (isNaN(d)) return String(iso);
  const p = (n) => String(n).padStart(2, '0');
  return (d.getMonth() + 1) + '-' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function countdown(t) {
  if (t.status !== 'pending') return t.status === 'sent' ? '已发送，待客户端反馈' : '';
  const ms = new Date(t.schedule_at) - Date.now();
  if (isNaN(ms)) return '';
  if (ms <= 0) return '已到点，等待推送';
  const m = Math.floor(ms / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (d > 0) return '还有 ' + d + ' 天 ' + (h % 24) + ' 时';
  if (h > 0) return '还有 ' + h + ' 时 ' + (m % 60) + ' 分';
  if (m > 0) return '还有 ' + m + ' 分';
  return '还有 ' + Math.floor(ms / 1000) + ' 秒';
}

function updateCountdowns() {
  document.querySelectorAll('.card[data-task]').forEach((card) => {
    const t = lastTasks.find(x => String(x.task_id) === card.dataset.task);
    const el = card.querySelector('[data-cd]');
    if (t && el) el.textContent = countdown(t);
  });
}

function renderTaskCards(tasks) {
  if (!tasks.length) {
    renderState('📭', taskStatus ? '无此状态的定时任务' : '暂无定时任务');
    return;
  }
  document.getElementById('card-list').innerHTML = tasks.map(taskHtml).join('');
  postRender();
  updateCountdowns();
}

function taskHtml(t) {
  const sm = STATUS_META[t.status] || [t.status, 'st-cancelled'];
  const cb = CB_META[t.callback] || [t.callback || '-', ''];
  const cbExtra = (t.callback === 'pending' && t.retry) ? '（重试' + t.retry + '）' : '';
  const acts = (t.status === 'pending' || t.status === 'sent')
    ? '<span class="task-actions">' +
      '<button class="btn-act done" data-tdone="' + t.task_id + '">完成</button>' +
      '<button class="btn-act" data-tsnooze="' + t.task_id + '" title="推迟60分钟">推迟</button>' +
      '<button class="btn-act cancel" data-tcancel="' + t.task_id + '" data-ref="' + esc(t.client_ref || '') + '" data-server="' + esc(t.server_name || '') + '">取消</button>' +
      '</span>' : '';
  return '<div class="card" data-task="' + t.task_id + '" data-id="' + (1000000 + t.task_id) + '">' +
    '<div class="card-top"><div class="card-left">' +
      '<span class="st-badge ' + sm[1] + '">' + sm[0] + '</span>' +
      '<span class="task-title">' + esc(t.title || t.client_ref || ('#' + t.task_id)) + '</span>' +
    '</div><span class="meta-time">#' + t.task_id + '</span></div>' +
    '<div class="card-msg"><button class="btn-copy" data-msg="' + esc(t.message || '') + '">复制</button>' +
      '<div class="card-msg-inner">' + renderMd(t.topic, t.message || '') + '</div></div>' +
    '<div class="card-meta">' +
      '<span class="topic-tag">' + esc(t.topic || '-') + '</span>' +
      '<span class="meta-server">' + esc(t.client_ref || '-') + '</span>' +
      '<span class="meta-time">排期 ' + esc(fmtSched(t.schedule_at)) + ' · <span data-cd></span></span>' +
      '<span class="meta-cb ' + cb[1] + '">' + cb[0] + cbExtra + '</span>' +
      acts +
    '</div></div>';
}

async function taskFeedback(el, action) {
  const id = el.dataset.tdone || el.dataset.tsnooze;
  if (!id || el.classList.contains('busy')) return;
  el.classList.add('busy');
  const old = el.textContent;
  el.textContent = '…';
  try {
    const res = await fetch('/api/task/' + id + '/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(action === 'snooze' ? { action, snooze_minutes: 60 } : { action }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    lastFingerprint = '';
    await loadTasks();
  } catch (e) {
    el.textContent = '失败';
    setTimeout(() => { el.textContent = old; el.classList.remove('busy'); }, 1500);
  }
}

async function taskCancel(el) {
  const id = el.dataset.tcancel;
  if (!id || el.classList.contains('busy')) return;
  if (!confirm('确定取消该定时任务吗？到点将不再推送。')) return;
  el.classList.add('busy');
  const old = el.textContent;
  el.textContent = '…';
  try {
    const res = await fetch('/api/task/' + encodeURIComponent(id) + '/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'cancelled' }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    lastFingerprint = '';
    await loadTasks();
  } catch (e) {
    el.textContent = '失败';
    setTimeout(() => { el.textContent = old; el.classList.remove('busy'); }, 1500);
  }
}

const es = new EventSource('/api/events');
es.onmessage = (e) => {
  try {
    const ev = JSON.parse(e.data);
    if (ev.type === 'new' && lastTotal !== null && ev.total > lastTotal) {
      newCount = ev.total - lastTotal;
      showNewHint();
    }
  } catch (err) { /* ignore */ }
};

comboSetup('filter-server', 'drop-server', 'clear-server', () => applyFilters());
comboSetup('filter-topic', 'drop-topic', 'clear-topic', () => applyFilters());
document.getElementById('tab-records').addEventListener('click', () => switchView('records'));
document.getElementById('tab-tasks').addEventListener('click', () => switchView('tasks'));
document.getElementById('task-pills').addEventListener('click', (e) => {
  const pill = e.target.closest('[data-tstatus]');
  if (!pill) return;
  taskStatus = pill.dataset.tstatus;
  document.querySelectorAll('#task-pills .tpill').forEach(p => p.classList.toggle('active', p === pill));
  lastFingerprint = '';
  loadTasks();
});
refresh();
</script>
</body>
